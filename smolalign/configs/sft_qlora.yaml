# QLoRA SFT config (Phase 2). Tuned to fit a single free Kaggle/Colab T4.
model:
  base: Qwen/Qwen2.5-1.5B          # start from BASE, not -Instruct
  load_in_4bit: true               # bitsandbytes NF4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

data:
  dataset: HuggingFaceTB/smoltalk   # or HuggingFaceH4/ultrachat_200k
  subset_size: 15000
  max_seq_len: 2048
  packing: true

train:
  epochs: 1
  per_device_batch_size: 8
  grad_accum_steps: 4               # effective batch 32
  lr: 2.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  gradient_checkpointing: true
  seed: 42
  save_steps: 200                   # checkpoint to Hub often — sessions time out
  output_repo: <your-hf-username>/smolalign-sft
