<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- CadastreAI Logo -->
  <!-- Concept: Property parcels forming a stylized C mark, representing the cadastral register -->

  <defs>
    <linearGradient id="parcelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d5a8f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Mark: 9 land parcels arranged as a cadastral grid forming a C -->
  <g transform="translate(15, 20)">
    <!-- Top row -->
    <rect x="0" y="0" width="22" height="22" fill="url(#parcelGrad)" rx="2"/>
    <rect x="26" y="0" width="22" height="22" fill="url(#parcelGrad)" rx="2"/>
    <rect x="52" y="0" width="22" height="22" fill="url(#parcelGrad)" rx="2"/>

    <!-- Middle left -->
    <rect x="0" y="26" width="22" height="22" fill="url(#parcelGrad)" rx="2"/>

    <!-- Accent parcel — the "AI" signal — highlighted -->
    <rect x="26" y="26" width="22" height="22" fill="url(#accentGrad)" rx="2"/>
    <circle cx="37" cy="37" r="4" fill="#fff"/>

    <!-- Bottom row -->
    <rect x="0" y="52" width="22" height="22" fill="url(#parcelGrad)" rx="2"/>
    <rect x="26" y="52" width="22" height="22" fill="url(#parcelGrad)" rx="2"/>
    <rect x="52" y="52" width="22" height="22" fill="url(#parcelGrad)" rx="2"/>
  </g>

  <!-- Wordmark -->
  <text x="115" y="62" font-family="'SF Pro Display', -apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="34" font-weight="700" fill="#1e3a5f" letter-spacing="-0.5">
    Cadastre<tspan fill="#d97706">AI</tspan>
  </text>

  <!-- Tagline -->
  <text x="116" y="84" font-family="'SF Pro Text', -apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="11" font-weight="400" fill="#64748b" letter-spacing="1.5">
    THE PROPERTY REGISTER, INTELLIGENT
  </text>
</svg>
