[project]
name = "cadastreai"
version = "0.1.0"
description = "AI research agent for the Australian housing market — RAG + fine-tuned retriever + agentic reasoning."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eric" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
# Heavy parsing deps — pulled in by `pip install .[parse]`. docling brings
# torch + vision models (~1-2 GB on first model download); kept optional
# so scraper/downloader-only users aren't forced to install them.
parse = [
    "docling>=2.0",
    "pymupdf4llm>=0.0.17",
]
chunk = [
    "tiktoken>=0.7",
]
embed = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
index = [
    "qdrant-client>=1.12",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
]
agent = [
    "anthropic>=0.39",
    "langgraph>=0.2",
    "langsmith>=0.1.140",
]
tools = [
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "pydantic>=2.0",
]
app = [
    "streamlit>=1.36",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
    "network: tests that need a populated tool cache or live HTTP",
]
