[project]
name = "cadastreai"
version = "0.1.0"
description = "AI research agent for the Australian housing market — RAG + fine-tuned retriever + agentic reasoning."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eric" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
