name: deploy_check

# Nightly health check (Task 4.16 follow-up) against the production
# Qdrant Cloud cluster. The nightly run is keyless and free; it catches:
#   - Qdrant Cloud cluster going down, being suspended, or losing the
#     collection
#   - the embedding model failing to load or retrieve
# A manual run with the `llm_smoke` input ticked also exercises the full
# agent with the 5 smoke queries, which catches:
#   - ANTHROPIC_API_KEY expiry / quota burn
#   - agent regressions that don't show up in unit tests
#
# This does NOT verify the deployed HF Space itself — that would be a
# separate curl-the-Space-URL job. For now we trust the Space's own
# Dockerfile HEALTHCHECK to catch its container-level failures, and use
# this workflow to catch the upstream-data-plane failures the Space
# can't detect (e.g. its Qdrant connection silently 401-ing).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   QDRANT_URL          Qdrant Cloud cluster URL
#   QDRANT_API_KEY      Qdrant Cloud API key
#   ANTHROPIC_API_KEY   Anthropic console key (only read by llm_smoke runs)
#
# Cost: the nightly run spends no API credit, only a few GHA minutes.
# An llm_smoke run adds ~$0.05 in Anthropic tokens:
#   gh workflow run deploy_check -f llm_smoke=true

on:
  schedule:
    # 03:00 UTC daily — well outside any sensible Australian work hours,
    # so a failure paging the maintainer doesn't wake them up.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      llm_smoke:
        description: "Also run the 5 agent smoke queries (uses ANTHROPIC_API_KEY, costs a few cents)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime extras
        # Same extras the agent needs at runtime — no `parse`, no `dev`.
        # Keeps the install ~3 minutes instead of pulling docling/torch.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[agent,index,embed,tools,app,chunk]"

      - name: Run deploy_check.sh
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          # Only passed on a manual run with llm_smoke ticked. The nightly
          # schedule runs keyless: Qdrant + embeddings only, no API spend,
          # so an empty or expired Anthropic key can't fail it.
          ANTHROPIC_API_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.llm_smoke) && secrets.ANTHROPIC_API_KEY || '' }}
          # Dense-only retrieval for the health check. This job's job is
          # to catch production *data-plane* failures — Qdrant Cloud
          # down, ANTHROPIC_API_KEY expired, embedding model broken.
          # The BM25 leg of the default hybrid retriever loads a 212 MB
          # pickle (data/processed/bm25.pkl) that is gitignored on main
          # and only shipped to the HF Space via LFS, so it can never be
          # present on a clean CI checkout. Forcing dense exercises the
          # exact remote dependencies this check exists to monitor; the
          # deployed Space still runs full hybrid.
          CADASTRE_AGENT_RETRIEVER: dense
          # The first doc query reloads the BGE model on this cold,
          # CPU-only runner (~50s one-time); the warm Space never pays
          # it. Raise the hard latency budget so the model-load penalty
          # isn't a false failure — the soft WARN (20s) still surfaces
          # in the log if something gets pathologically slow.
          SMOKE_HARD_LATENCY_S: "90"
        run: bash scripts/deploy_check.sh
