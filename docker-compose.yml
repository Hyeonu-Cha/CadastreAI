services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: cadastre-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional: OSS tracing UI for LangGraph / agent trajectories.
  # Enable with: `docker compose --profile tracing up`
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: cadastre-phoenix
    restart: unless-stopped
    profiles: ["tracing"]
    ports:
      - "6006:6006"   # UI
      - "4317:4317"   # OTLP gRPC collector
    environment:
      PHOENIX_WORKING_DIR: /phoenix
    volumes:
      - phoenix_data:/phoenix

volumes:
  qdrant_storage:
  phoenix_data:
